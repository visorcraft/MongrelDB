name: Investigate sorted-run HLC visibility

on:
  push:
    branches: [agent/fix-run-hlc-visibility-ca3]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Locate snapshot-sensitive sorted-run calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/run-hlc-inventory.txt
          from pathlib import Path
          import re

          root = Path('crates')
          patterns = [
              'get_version', 'visible_versions', 'visible_rows', 'visible_indices',
              'visible_indices_native', 'range_row_ids_visible_i64',
              'range_row_ids_visible_f64', 'null_row_ids_visible',
              'into_visible_version_cursor', 'visible_positions_with_rids',
              'find_version_page',
          ]
          print('=== sorted-run APIs ===')
          path = Path('crates/mongreldb-core/src/sorted_run.rs')
          for number, line in enumerate(path.read_text().splitlines(), 1):
              if any(pattern in line for pattern in patterns):
                  print(f'{path}:{number}:{line}')

          print('=== call sites ===')
          call = re.compile(r'\.(?:' + '|'.join(map(re.escape, patterns[:8] + ['into_visible_version_cursor'])) + r')\(')
          for path in sorted(root.rglob('*.rs')):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if call.search(line):
                      print(f'{path}:{number}:{line}')

          print('=== existing HLC tests ===')
          paths = list(Path('crates/mongreldb-core/tests').glob('*.rs')) + [
              Path('crates/mongreldb-core/src/sorted_run.rs'),
              Path('crates/mongreldb-core/src/engine.rs'),
          ]
          hits = []
          for path in paths:
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if any(term in line for term in ('HLC', 'hlc', 'at_hlc', 'version_is_newer')):
                      hits.append(f'{path}:{number}:{line}')
          print('\n'.join(hits[-400:]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run-hlc-call-site-inventory
          path: /tmp/run-hlc-inventory.txt
          if-no-files-found: error
