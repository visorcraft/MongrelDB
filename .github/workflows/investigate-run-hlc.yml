name: Investigate sorted-run HLC visibility

on:
  push:
    branches: [agent/fix-run-hlc-visibility-ca3]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Locate snapshot-sensitive sorted-run calls
        shell: bash
        run: |
          set -euo pipefail
          echo '=== sorted-run APIs ==='
          rg -n 'pub (fn|\(crate\) fn) (get_version|visible_versions|visible_rows|visible_indices|visible_indices_native|range_row_ids_visible_i64|range_row_ids_visible_f64|null_row_ids_visible)|into_visible_version_cursor|visible_positions_with_rids|find_version_page' crates/mongreldb-core/src/sorted_run.rs
          echo '=== call sites ==='
          rg -n '\.(get_version|visible_versions|visible_rows|visible_indices|visible_indices_native|range_row_ids_visible_i64|range_row_ids_visible_f64|null_row_ids_visible|into_visible_version_cursor)\(' crates --glob '*.rs'
          echo '=== existing HLC tests ==='
          rg -n 'HLC|hlc|at_hlc|version_is_newer' crates/mongreldb-core/tests crates/mongreldb-core/src/sorted_run.rs crates/mongreldb-core/src/engine.rs | tail -300
