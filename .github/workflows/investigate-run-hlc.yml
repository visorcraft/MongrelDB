name: Validate sorted-run HLC visibility

on:
  push:
    branches: [agent/fix-run-hlc-visibility-ca3]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"
  GENERATOR_SHA256: efb24dc003aed4945dddb35e8c2e065167837f3459ec7761a7ccf58d410812dd

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Reconstruct and apply production patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts /tmp/run-hlc-validation/sources
          cat .github/run-hlc-parts/* | base64 -d > .github/scripts/apply_run_hlc_fix.py
          echo "$GENERATOR_SHA256  .github/scripts/apply_run_hlc_fix.py" | sha256sum --check -
          python3 .github/scripts/apply_run_hlc_fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/mongreldb-core/src/sorted_run.rs')
          source = path.read_text()
          edits = [
              (
                  '    pub(crate) fn into_visible_version_cursor(\n',
                  '    #[cfg(test)]\n    pub(crate) fn into_visible_version_cursor(\n',
              ),
              (
                  '    fn find_version_page(\n',
                  '    #[allow(dead_code)]\n    fn find_version_page(\n',
              ),
              (
                  '            for index in lo..=hi {\n                let epoch = Epoch(epochs[index] as u64);\n',
                  '            for (index, &epoch_value) in epochs.iter().enumerate().take(hi + 1).skip(lo) {\n                let epoch = Epoch(epoch_value as u64);\n',
              ),
          ]
          for old, new in edits:
              if source.count(old) != 1:
                  raise SystemExit(f'expected one generated lint target, found {source.count(old)}: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo +"$RUST_VERSION" fmt
          git diff --check
          git diff --stat | tee /tmp/run-hlc-validation/diff-stat.txt
          git diff --binary ca3d0b2442bc83759686fa8fd0a449964d7a68a8 -- \
            crates/mongreldb-core/src/sorted_run.rs \
            crates/mongreldb-core/src/engine.rs \
            crates/mongreldb-core/tests/sorted_run_hlc_visibility.rs \
            > /tmp/run-hlc-validation/run-hlc-fix.patch
          cp crates/mongreldb-core/src/sorted_run.rs \
            /tmp/run-hlc-validation/sources/sorted_run.rs
          cp crates/mongreldb-core/src/engine.rs \
            /tmp/run-hlc-validation/sources/engine.rs
          cp crates/mongreldb-core/tests/sorted_run_hlc_visibility.rs \
            /tmp/run-hlc-validation/sources/sorted_run_hlc_visibility.rs
      - name: Formatting and Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo +"$RUST_VERSION" fmt --check 2>&1 \
            | tee /tmp/run-hlc-validation/fmt.log
          cargo +"$RUST_VERSION" clippy -p mongreldb-core \
            --all-targets --all-features -- -D warnings 2>&1 \
            | tee /tmp/run-hlc-validation/clippy.log
      - name: Focused HLC regression tests
        shell: bash
        run: |
          set -o pipefail
          cargo +"$RUST_VERSION" test -p mongreldb-core --all-features \
            --test sorted_run_hlc_visibility -- --nocapture 2>&1 \
            | tee /tmp/run-hlc-validation/focused.log
          cargo +"$RUST_VERSION" test -p mongreldb-core --all-features \
            p05_t3 -- --nocapture 2>&1 \
            | tee -a /tmp/run-hlc-validation/focused.log
      - name: Complete core suite
        shell: bash
        run: |
          set -o pipefail
          cargo +"$RUST_VERSION" test -p mongreldb-core --all-features 2>&1 \
            | tee /tmp/run-hlc-validation/core-suite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-hlc-validation
          path: /tmp/run-hlc-validation
          if-no-files-found: warn
