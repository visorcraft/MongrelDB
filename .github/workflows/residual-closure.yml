# Residual closure — five-item evidence pipeline (TODO §6).
#
# This workflow is the structural gate that proves the five residual items
# (RunLookupDirectory, async persistent result cache, streaming cursors,
# non-Bitmap churn oracle, HOT fallback observability) all close under one
# evidence bundle. The final job delegates the heavy lifting to
# `scripts/run-residual-closure.sh`, which runs the eight canonical seeds,
# tees every test log, harvests benchmark JSON, and writes
# `closure-checklist.md` (Spec §12).
#
# Triggered:
#   - on demand: workflow_dispatch (with optional `ref` for the exact-SHA gate)
#   - on PR: pull_request touching mongreldb-core or mongreldb-server
#   - nightly: schedule (cron 0 4 * * *) for the slow jobs

name: residual-closure

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to check out (defaults to the runner default branch HEAD)."
        required: false
        type: string
  pull_request:
    paths:
      - "crates/mongreldb-core/**"
      - "crates/mongreldb-server/**"
      - "crates/mongreldb-core/tests/point_lookup_directory.rs"
      - "crates/mongreldb-core/tests/result_cache_async_persistence.rs"
      - "crates/mongreldb-core/tests/controlled_scan_streaming.rs"
      - "crates/mongreldb-core/tests/index_churn_oracle.rs"
      - "crates/mongreldb-core/tests/lookup_metrics.rs"
      - "docs/architecture/point-lookup-directory.md"
      - "docs/architecture/controlled-cursor.md"
      - "docs/architecture/adr/0013-persistent-result-cache-publication.md"
      - "docs/architecture/adr/0014-residual-closure-evidence.md"
      - "docs/operations/hot-fallback.md"
      - "scripts/run-residual-closure.sh"
      - ".github/workflows/residual-closure.yml"
  schedule:
    # nightly at 04:00 UTC; staggered to avoid the qualification window.
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  # ---- structural checks --------------------------------------------------
  # Lightweight per-topic structure jobs run before the heavyweight
  # `run-closure-script` job. They keep the per-PR signal cheap and the
  # full pipeline's `needs:` graph acyclic.

  point-lookup-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo fmt --check
      - run: cargo clippy -p mongreldb-core --all-targets --all-features -- -D warnings
      - run: cargo test -p mongreldb-core --test point_lookup_directory --all-features
      - run: cargo test -p mongreldb-core --lib run_lookup::tests --all-features

  result-cache-async-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo test -p mongreldb-core --test result_cache_async_persistence --all-features

  controlled-scan-streaming-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo test -p mongreldb-core --test controlled_scan_streaming --all-features

  hot-observability-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo test -p mongreldb-core --test lookup_metrics --all-features

  # ---- PR E: 8-seed matrix ------------------------------------------------
  # The non-Bitmap churn oracle (TODO §4.6) requires 30 consecutive nightly
  # + 4 weekly passes against 100 seeds × 10,000 ops. The smoke surface
  # exercises the 8 canonical seeds every run so the wall-clock requirement
  # has a deterministic per-PR signal.

  index-churn-oracle-smoke:
    runs-on: ubuntu-latest
    needs: point-lookup-structure
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Run index-churn oracle smoke (seed ${{ matrix.seed }})
        env:
          MONGRELDB_ORACLE_SEED: ${{ matrix.seed }}
        run: |
          cargo test -p mongreldb-core --test index_churn_oracle --all-features -- --nocapture

  # ---- final orchestrator -------------------------------------------------
  # `run-closure-script` is the one job that produces the full evidence
  # bundle. Every other job above is a fast pre-check; the script bundles
  # the slow benchmarks, ignored tests, and the closure checklist.

  run-closure-script:
    runs-on: ubuntu-latest
    needs:
      - point-lookup-structure
      - result-cache-async-race
      - controlled-scan-streaming-structure
      - hot-observability-core
      - index-churn-oracle-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Run residual-closure orchestrator
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          TOOLCHAIN: 1.97.1
        run: |
          bash scripts/run-residual-closure.sh
      - name: Upload closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: residual-closure-evidence
          path: ${{ runner.temp }}/mongreldb-residual-closure/

  # ---- exact-SHA final gate (Spec §12.5) ----------------------------------
  # workflow_dispatch callers can pin `inputs.ref` to a release SHA; this
  # job downloads the evidence bundle, reads `commit.txt`, and fails if
  # the recorded SHA does not match the input.

  verify-exact-sha:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.ref != ''
    needs: run-closure-script
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Download closure evidence
        uses: actions/download-artifact@v4
        with:
          name: residual-closure-evidence
          path: ${{ runner.temp }}/mongreldb-residual-closure/
      - name: Verify commit SHA matches inputs.ref
        env:
          EXPECTED_SHA: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          recorded="$(cat "$RUNNER_TEMP/mongreldb-residual-closure/commit.txt")"
          # Strip any leading/trailing whitespace and a possible "git describe" prefix.
          recorded_sha="$(echo "$recorded" | tr -d '[:space:]')"
          expected_sha="$(echo "$EXPECTED_SHA" | tr -d '[:space:]')"
          # Accept either a full 40-char SHA or a short SHA; resolve short SHAs.
          if [[ "${#expected_sha}" -lt 40 ]]; then
            expected_sha="$(git rev-parse "$expected_sha")"
          fi
          if [[ "$recorded_sha" != "$expected_sha" ]]; then
            echo "FAIL: commit.txt ($recorded_sha) != inputs.ref ($expected_sha)" >&2
            exit 1
          fi
          echo "OK: commit.txt ($recorded_sha) matches inputs.ref"
