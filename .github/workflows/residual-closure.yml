# Residual closure — fail-closed pipeline (Spec REM-I §13, REM-G §11,
# REM-H §12).
#
# This workflow is the structural gate that proves the residual issues close
# under one evidence bundle. It uses a strict fail-closed orchestrator
# (`scripts/run-residual-closure.sh`) driven by ONE evidence contract
# (`scripts/residual-closure-contract.json`, §13.3), and a final aggregation
# job that parses `closure-status.json` and refuses to publish when
# `overall != "pass"` or any top-level threshold is false (§13.8).
#
# Event split (§13.12):
#   * pull_request      — fast structural gates + orchestrator self-tests
#                         only. No PR artifact is ever labeled "final
#                         closure"; the heavy evidence bundle is not built.
#   * workflow_dispatch — everything: structural gates, release-mode
#     schedule        — performance, exact-SHA orchestrator, exact-SHA
#                         verification, and the nightly/weekly churn history
#                         gate (REM-H via scripts/churn-history-check.sh).
#
# Churn smoke (§11.2–§11.3): each matrix job runs exactly ONE seed from
# MONGRELDB_ORACLE_SEED with MONGRELDB_ORACLE_OPERATIONS=500; the test
# process must not loop all eight seeds internally.

name: residual-closure

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to check out (defaults to the runner default branch HEAD)."
        required: false
        type: string
  pull_request:
    paths:
      - "crates/mongreldb-core/**"
      - "crates/mongreldb-server/**"
      - "crates/mongreldb-core/tests/point_lookup_directory.rs"
      - "crates/mongreldb-core/tests/point_lookup_runs.rs"
      - "crates/mongreldb-core/tests/result_cache_async_persistence.rs"
      - "crates/mongreldb-core/tests/result_cache_production.rs"
      - "crates/mongreldb-core/tests/controlled_scan_streaming.rs"
      - "crates/mongreldb-core/tests/index_churn_oracle.rs"
      - "crates/mongreldb-core/tests/lookup_metrics.rs"
      - "scripts/run-residual-closure.sh"
      - "scripts/residual-closure-contract.json"
      - "scripts/fixtures/residual-closure/**"
      - ".github/workflows/residual-closure.yml"
  schedule:
    # nightly at 04:00 UTC; staggered to avoid the qualification window.
    - cron: "0 4 * * *"

permissions:
  contents: read

# Default env for every job: pin the toolchain; the orchestrator records
# the resolved version into the closure bundle.
env:
  TOOLCHAIN: "1.97.1"

jobs:
  # -------------------------------------------------------------------------
  # 1. Formatting + clippy (structural gate).
  # -------------------------------------------------------------------------
  formatting-clippy:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift || true
          sudo docker system prune -af || true
          df -h
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      # mongreldb-protocol's build script needs protoc (workspace scope).
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --exclude mongreldb-perf -- -D warnings

  # -------------------------------------------------------------------------
  # 2. Point-lookup directory structure.
  # -------------------------------------------------------------------------
  point-directory-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test point_lookup_directory --all-features
      - run: cargo test -p mongreldb-core --lib run_lookup::tests --all-features

  # -------------------------------------------------------------------------
  # 3. HLC multi-run regressions. Exact suites per the §13.11 checklist
  # contract — not a proxy log from an unrelated suite.
  # -------------------------------------------------------------------------
  hlc-multirun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --lib rem001_multi_run_hlc_authority --all-features
      - run: cargo test -p mongreldb-core --test sorted_run_hlc_visibility --all-features

  # -------------------------------------------------------------------------
  # 4. Persistent-cache integration / race / reopen. No `--ignored` leg:
  # the suites carry no ignored tests, so an ignored-only run would be a
  # vacuous proof (§13.4).
  # -------------------------------------------------------------------------
  result-cache-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test result_cache_async_persistence --all-features
      - run: cargo test -p mongreldb-core --test result_cache_production --all-features

  # -------------------------------------------------------------------------
  # 5. Controlled-scan structure.
  # -------------------------------------------------------------------------
  controlled-scan-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test controlled_scan_streaming --all-features

  # -------------------------------------------------------------------------
  # 6. HNSW connectivity.
  # -------------------------------------------------------------------------
  hnsw-connectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test hnsw_connectivity --all-features

  # -------------------------------------------------------------------------
  # 7. 8-seed churn smoke (§11.2–§11.3). Each matrix job supplies exactly
  # ONE seed via MONGRELDB_ORACLE_SEED and the documented 500-operation
  # density via MONGRELDB_ORACLE_OPERATIONS; fail-fast is disabled so all
  # seed failures are collected.
  # -------------------------------------------------------------------------
  eight-seed-churn-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      MONGRELDB_ORACLE_SEED: ${{ matrix.seed }}
      MONGRELDB_ORACLE_OPERATIONS: "500"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Churn oracle smoke seed ${{ matrix.seed }} (500 ops)
        run: cargo test -p mongreldb-core --test index_churn_oracle --all-features -- --nocapture

  # -------------------------------------------------------------------------
  # 8. HOT metrics / observability.
  # -------------------------------------------------------------------------
  hot-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      # mongreldb-server (all-features → native-rpc → mongreldb-protocol)
      # needs protoc for the build script.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test -p mongreldb-core --test lookup_metrics --all-features
      - run: cargo test -p mongreldb-server --test hot_metrics_export --all-features

  # -------------------------------------------------------------------------
  # 9. Full core tests — dedicated full-suite command.
  # -------------------------------------------------------------------------
  full-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --tests --all-features --lib

  # -------------------------------------------------------------------------
  # 10. Full workspace tests (non-core). Core is covered by full-core-tests;
  # mongreldb-perf is excluded because its bundled DuckDB/SQLite debug build
  # exhausts GitHub-hosted runner disks ("No space left on device").
  # -------------------------------------------------------------------------
  full-workspace-tests:
    runs-on: ubuntu-latest
    env:
      # Shrink debug artifacts so workspace+all-features fits on GHA disks.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Free disk space
        run: |
          set -euo pipefail
          # Same reclaim set as release-qualification.yml — full workspace
          # debug builds otherwise hit "No space left on device" mid-compile.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift || true
          sudo docker system prune -af || true
          df -h
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      # Workspace scope pulls in mongreldb-protocol; its build script
      # needs protoc.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: cargo test (workspace, exclude core+perf)
        run: |
          set -euo pipefail
          cargo test --workspace --all-features \
            --exclude mongreldb-core \
            --exclude mongreldb-perf \
            --tests
          df -h

  # -------------------------------------------------------------------------
  # 11. Release-mode performance (§13.12). Heavy release-mode benchmarks;
  # only runs on workflow_dispatch and scheduled closure runs, never on
  # pull requests.
  # -------------------------------------------------------------------------
  release-mode-performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [formatting-clippy, eight-seed-churn-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Release-mode benchmarks
        run: |
          cargo test -p mongreldb-core --release \
            --test point_lookup_runs -- --include-ignored --nocapture
          cargo test -p mongreldb-core --release \
            --test result_cache_async_persistence -- --include-ignored --nocapture
          cargo test -p mongreldb-core --release \
            --test controlled_scan_streaming -- --include-ignored --nocapture

  # -------------------------------------------------------------------------
  # 12. Nightly/weekly churn history (REM-H §12, required by §13.12 for
  # final closure). scripts/churn-history-check.sh verifies the durable
  # 30-nightly / 4-weekly success history; without it final closure must
  # refuse to pass. Never runs on pull requests.
  # -------------------------------------------------------------------------
  churn-history:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Capture requested SHA
        id: sha
        run: |
          requested="${{ github.event.inputs.ref || github.sha }}"
          requested="$(git rev-parse "$requested")"
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
      - name: Verify nightly/weekly churn history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/churn-history-check.sh \
            --expected-sha "${{ steps.sha.outputs.requested }}"

  # -------------------------------------------------------------------------
  # 13. Orchestrator self-tests (§13.13). Runs the script's helper
  # functions through the dedicated self-test mode to prove they fail
  # closed without touching the real worktree.
  # -------------------------------------------------------------------------
  orchestrator-self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Validate evidence contract
        run: |
          set -euo pipefail
          jq -e . scripts/residual-closure-contract.json > /dev/null
          # Every JSON fixture must parse except closure-status-malformed.json,
          # which is intentionally invalid for the self-test battery.
          find scripts/fixtures/residual-closure -name '*.json' \
            ! -name 'closure-status-malformed.json' -print0 \
            | while IFS= read -r -d '' f; do jq -e . "$f" > /dev/null; done
          find scripts/fixtures/residual-closure -name '*.jsonl' -print0 \
            | while IFS= read -r -d '' f; do jq -e . "$f" > /dev/null; done
      - name: Run orchestrator self-tests
        run: |
          set -euo pipefail
          bash scripts/run-residual-closure.sh self-test "${RUNNER_TEMP}/orchestrator-selftest"

  # -------------------------------------------------------------------------
  # 14. Final orchestrator (§13.12). Runs
  # `scripts/run-residual-closure.sh` end-to-end with the requested SHA
  # checked out BEFORE capturing it. Only workflow_dispatch and scheduled
  # runs build this bundle — pull requests never produce an artifact that
  # could be mistaken for final closure evidence.
  # -------------------------------------------------------------------------
  run-orchestrator:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs:
      - formatting-clippy
      - point-directory-structure
      - hlc-multirun
      - result-cache-race
      - controlled-scan-structure
      - hnsw-connectivity
      - eight-seed-churn-smoke
      - hot-observability
      - full-core-tests
      - full-workspace-tests
      - orchestrator-self-tests
    env:
      MONGRELDB_ORACLE_OPERATIONS: "500"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift || true
          sudo docker system prune -af || true
          df -h
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      # The orchestrator builds server and workspace targets; protoc is
      # required by mongreldb-protocol's build script.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Capture requested SHA
        id: sha
        run: |
          requested="${{ github.event.inputs.ref || github.sha }}"
          requested="$(git rev-parse "$requested")"
          short="${requested:0:12}"
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - name: Run residual-closure orchestrator
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          EXPECTED_SHA: ${{ steps.sha.outputs.requested }}
        run: |
          bash scripts/run-residual-closure.sh
      - name: Upload closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: residual-closure-${{ steps.sha.outputs.short }}
          path: ${{ runner.temp }}/mongreldb-residual-closure/

  # -------------------------------------------------------------------------
  # 15. Exact-SHA verification (§13.12). Downloads the bundle and rejects
  # it when the recorded SHA does not match the workflow trigger ref.
  # -------------------------------------------------------------------------
  verify-exact-sha:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: run-orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Capture requested SHA
        id: sha
        run: |
          requested="${{ github.event.inputs.ref || github.sha }}"
          requested="$(git rev-parse "$requested")"
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "short=${requested:0:12}" >> "$GITHUB_OUTPUT"
      - name: Download closure evidence
        uses: actions/download-artifact@v4
        with:
          name: residual-closure-${{ steps.sha.outputs.short }}
          path: ${{ runner.temp }}/mongreldb-residual-closure/
      - name: Verify commit SHA matches trigger ref
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.requested }}
        run: |
          set -euo pipefail
          bundle_sha="$(cat "${RUNNER_TEMP}/mongreldb-residual-closure/commit.txt" | tr -d '[:space:]')"
          expected="$(echo "$EXPECTED_SHA" | tr -d '[:space:]')"
          if [[ "$bundle_sha" != "$expected" ]]; then
            echo "FAIL: bundle sha ($bundle_sha) != trigger sha ($expected)" >&2
            exit 1
          fi
          echo "OK: bundle sha matches trigger"

  # -------------------------------------------------------------------------
  # 16. Final aggregation (§13.12). Depends on every required job
  # including release-mode performance, exact-SHA verification, and the
  # nightly/weekly churn history. Does NOT use `if: always()` to declare
  # success when dependencies failed; only ever publishes when
  # `overall == pass` and every top-level threshold is true (§13.8).
  # -------------------------------------------------------------------------
  final-aggregate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs:
      - run-orchestrator
      - verify-exact-sha
      - release-mode-performance
      - churn-history
      - formatting-clippy
      - point-directory-structure
      - hlc-multirun
      - result-cache-race
      - controlled-scan-structure
      - hnsw-connectivity
      - eight-seed-churn-smoke
      - hot-observability
      - full-core-tests
      - full-workspace-tests
      - orchestrator-self-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Capture requested SHA
        id: sha
        run: |
          requested="${{ github.event.inputs.ref || github.sha }}"
          requested="$(git rev-parse "$requested")"
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "short=${requested:0:12}" >> "$GITHUB_OUTPUT"
      - name: Download closure evidence
        uses: actions/download-artifact@v4
        with:
          name: residual-closure-${{ steps.sha.outputs.short }}
          path: ${{ runner.temp }}/mongreldb-residual-closure/
      - name: Parse closure-status.json and require overall == pass
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.requested }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/mongreldb-residual-closure"
          [[ -s "$bundle/closure-status.json" ]] || { echo "FAIL: closure-status.json missing" >&2; exit 1; }

          overall="$(jq -r '.overall // "fail"' "$bundle/closure-status.json")"
          [[ "$overall" == "pass" ]] || {
            echo "FAIL: closure-status.json overall=$overall (expected pass)" >&2
            jq -S '.suites[] | select(.exit_code != 0 or .required_tests == "fail" or .thresholds == "fail") | {name, exit_code, required_tests, thresholds}' \
              "$bundle/closure-status.json" >&2 || true
            exit 1
          }

          # §13.8: top-level thresholds must be true — a false threshold
          # rejects the bundle even when every suite is green.
          thresholds_verdict="$(jq -r '
              if ((.thresholds.complete_miss_ok == 1 or .thresholds.complete_miss_ok == true)
                  and (.thresholds.point_lookup_p95_ratio_ok == 1 or .thresholds.point_lookup_p95_ratio_ok == true))
              then "ok" else "fail" end
            ' "$bundle/closure-status.json")"
          [[ "$thresholds_verdict" == "ok" ]] || {
            echo "FAIL: closure-status.json top-level thresholds not all true" >&2
            jq -c '.thresholds' "$bundle/closure-status.json" >&2 || true
            exit 1
          }

          # Cross-check the bundle SHA against the workflow trigger ref.
          bundle_sha="$(cat "$bundle/commit.txt" | tr -d '[:space:]')"
          expected="$(echo "$EXPECTED_SHA" | tr -d '[:space:]')"
          [[ "$bundle_sha" == "$expected" ]] || {
            echo "FAIL: bundle sha ($bundle_sha) != trigger sha ($expected)" >&2
            exit 1
          }

          # Cross-check that every shard has a matching SHA sidecar.
          while IFS= read -r sidecar; do
            [[ -z "$sidecar" ]] && continue
            sha="$(cat "$sidecar")"
            [[ "$sha" == "$expected" ]] || {
              echo "FAIL: sidecar $sidecar sha=$sha != expected=$expected" >&2
              exit 1
            }
          done < <(find "$bundle" -name '*.sha' -print)

          # Cross-check that every suite recorded exit_code == 0 and
          # declared thresholds/required-tests are pass.
          bad="$(jq -r '
              [.suites[]
                | select(
                    .exit_code != 0
                    or .required_tests == "fail"
                    or .thresholds == "fail"
                  )
              ] | length' "$bundle/closure-status.json")"
          [[ "$bad" == "0" ]] || {
            echo "FAIL: $bad suite(s) reported a non-pass state" >&2
            exit 1
          }

          echo "OK: closure-status.json reports overall=pass; thresholds true; bundle sha matches; all shards stamped."

  # -------------------------------------------------------------------------
  # PR structural aggregate (§13.12). Pull requests run only the faster
  # structural gates; this job never touches the final-closure evidence
  # bundle and never labels anything "final closure".
  # -------------------------------------------------------------------------
  pr-aggregate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs:
      - formatting-clippy
      - point-directory-structure
      - hlc-multirun
      - result-cache-race
      - controlled-scan-structure
      - hnsw-connectivity
      - eight-seed-churn-smoke
      - hot-observability
      - full-core-tests
      - full-workspace-tests
      - orchestrator-self-tests
    steps:
      - name: Structural gates passed (not a final-closure run)
        run: |
          echo "PR structural gates passed. This is NOT final closure evidence:"
          echo "release-mode performance, exact-SHA orchestration, exact-SHA"
          echo "verification, and nightly/weekly churn history only run on"
          echo "workflow_dispatch and scheduled runs."
