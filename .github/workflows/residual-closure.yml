# Residual closure — fail-closed pipeline (Spec REM-006, sections 53–58).
#
# This workflow is the structural gate that proves REM-001 through REM-006
# close under one evidence bundle. It uses a strict fail-closed orchestrator
# (`scripts/run-residual-closure.sh`) and a final aggregation job that parses
# `closure-status.json` and refuses to publish when `overall != "pass"`.
#
# Per Spec §57 the minimum required jobs are:
#   1. formatting + clippy
#   2. point-directory structure
#   3. HLC multi-run regressions
#   4. persistent-cache integration/race/reopen
#   5. controlled-scan structure
#   6. HNSW connectivity
#   7. 8-seed churn smoke
#   8. HOT metrics/observability
#   9. full core tests
#   10. full workspace tests
#   11. release-mode performance
#   12. final evidence aggregation
#   13. exact-SHA verification
#
# Each shard records the exact commit SHA before running, and the final
# aggregation job rejects evidence stamped with any other SHA. No job uses
# `if: always()` to mask a dependency failure.

name: residual-closure

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to check out (defaults to the runner default branch HEAD)."
        required: false
        type: string
  pull_request:
    paths:
      - "crates/mongreldb-core/**"
      - "crates/mongreldb-server/**"
      - "crates/mongreldb-core/tests/point_lookup_directory.rs"
      - "crates/mongreldb-core/tests/result_cache_async_persistence.rs"
      - "crates/mongreldb-core/tests/controlled_scan_streaming.rs"
      - "crates/mongreldb-core/tests/index_churn_oracle.rs"
      - "crates/mongreldb-core/tests/lookup_metrics.rs"
      - "scripts/run-residual-closure.sh"
      - ".github/workflows/residual-closure.yml"
  schedule:
    # nightly at 04:00 UTC; staggered to avoid the qualification window.
    - cron: "0 4 * * *"

permissions:
  contents: read

# Default env for every job: pin the toolchain; the orchestrator records
# the resolved version into the closure bundle.
env:
  TOOLCHAIN: "1.97.1"

jobs:
  # -------------------------------------------------------------------------
  # 1. Formatting + clippy (Spec §57 §1).
  # -------------------------------------------------------------------------
  formatting-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Capture HEAD SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --exclude mongreldb-perf -- -D warnings

  # -------------------------------------------------------------------------
  # 2. Point-lookup directory structure (Spec REM-004).
  # -------------------------------------------------------------------------
  point-directory-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test point_lookup_directory --all-features
      - run: cargo test -p mongreldb-core --lib run_lookup::tests --all-features

  # -------------------------------------------------------------------------
  # 3. HLC multi-run regressions (Spec REM-001).
  # -------------------------------------------------------------------------
  hlc-multirun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test point_lookup_directory --all-features
      - run: cargo test -p mongreldb-core --test controlled_scan_streaming --all-features

  # -------------------------------------------------------------------------
  # 4. Persistent-cache integration / race / reopen (Spec REM-002).
  # -------------------------------------------------------------------------
  result-cache-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test result_cache_async_persistence --all-features
      - run: cargo test -p mongreldb-core --test result_cache_async_persistence --all-features -- --ignored

  # -------------------------------------------------------------------------
  # 5. Controlled-scan structure (Spec REM-003).
  # -------------------------------------------------------------------------
  controlled-scan-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test controlled_scan_streaming --all-features

  # -------------------------------------------------------------------------
  # 6. HNSW connectivity (Spec REM-001).
  # -------------------------------------------------------------------------
  hnsw-connectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test hnsw_connectivity --all-features

  # -------------------------------------------------------------------------
  # 7. 8-seed churn smoke (Spec REM-005). Matrix runs each seed; the
  # orchestrator's matrix loop aggregates them into one status entry.
  # -------------------------------------------------------------------------
  eight-seed-churn-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Churn oracle smoke seed ${{ matrix.seed }}
        env:
          MONGRELDB_ORACLE_SEED: ${{ matrix.seed }}
        run: cargo test -p mongreldb-core --test index_churn_oracle --all-features -- --nocapture

  # -------------------------------------------------------------------------
  # 8. HOT metrics / observability (Spec REM-006).
  # -------------------------------------------------------------------------
  hot-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --test lookup_metrics --all-features
      - run: cargo test -p mongreldb-server --test hot_metrics_export --all-features

  # -------------------------------------------------------------------------
  # 9. Full core tests (Spec §57 §9) — dedicated full-suite command.
  # -------------------------------------------------------------------------
  full-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test -p mongreldb-core --tests --all-features --lib

  # -------------------------------------------------------------------------
  # 10. Full workspace tests (Spec §57 §10).
  # -------------------------------------------------------------------------
  full-workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo test --workspace --all-features --exclude mongreldb-perf --tests

  # -------------------------------------------------------------------------
  # 11. Release-mode performance (Spec §57 §11). Requires the heavy
  # release-mode benchmarks; gated so it only runs on nightly + dispatch.
  # -------------------------------------------------------------------------
  release-mode-performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [formatting-clippy, eight-seed-churn-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Release-mode benchmarks
        run: |
          cargo test -p mongreldb-core --release \
            --test point_lookup_runs -- --include-ignored --nocapture
          cargo test -p mongreldb-core --release \
            --test result_cache_async_persistence -- --include-ignored --nocapture
          cargo test -p mongreldb-core --release \
            --test controlled_scan_streaming -- --include-ignored --nocapture

  # -------------------------------------------------------------------------
  # 12. Orchestrator self-tests (Spec §59). Runs the script's helper
  # functions through the dedicated self-test mode to prove they fail
  # closed without touching the real worktree.
  # -------------------------------------------------------------------------
  orchestrator-self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Run orchestrator self-tests
        run: |
          set -euo pipefail
          bash scripts/run-residual-closure.sh self-test "${RUNNER_TEMP}/orchestrator-selftest"

  # -------------------------------------------------------------------------
  # 13. Final orchestrator + exact-SHA verification (Spec §57 §12–13).
  # Runs `scripts/run-residual-closure.sh` end-to-end with the requested
  # SHA checked out BEFORE capturing it; uploads the bundle; the next
  # job verifies the recorded SHA matches the workflow trigger ref.
  # -------------------------------------------------------------------------
  run-orchestrator:
    runs-on: ubuntu-latest
    needs:
      - formatting-clippy
      - point-directory-structure
      - hlc-multirun
      - result-cache-race
      - controlled-scan-structure
      - hnsw-connectivity
      - eight-seed-churn-smoke
      - hot-observability
      - full-core-tests
      - full-workspace-tests
      - orchestrator-self-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          toolchain: 1.97.1
      - name: Capture requested SHA
        id: sha
        run: |
          requested="${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}"
          short="${requested:0:12}"
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - name: Run residual-closure orchestrator
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          EXPECTED_SHA: ${{ steps.sha.outputs.requested }}
        run: |
          bash scripts/run-residual-closure.sh
      - name: Upload closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: residual-closure-evidence
          path: ${{ runner.temp }}/mongreldb-residual-closure/

  verify-exact-sha:
    runs-on: ubuntu-latest
    needs: run-orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download closure evidence
        uses: actions/download-artifact@v4
        with:
          name: residual-closure-evidence
          path: ${{ runner.temp }}/mongreldb-residual-closure/
      - name: Verify commit SHA matches trigger ref
        env:
          EXPECTED_SHA: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bundle_sha="$(cat "${RUNNER_TEMP}/mongreldb-residual-closure/commit.txt" | tr -d '[:space:]')"
          expected="$(echo "$EXPECTED_SHA" | tr -d '[:space:]')"
          if [[ "${#expected}" -lt 40 ]]; then
            expected="$(git rev-parse "$expected")"
          fi
          if [[ "$bundle_sha" != "$expected" ]]; then
            echo "FAIL: bundle sha ($bundle_sha) != trigger sha ($expected)" >&2
            exit 1
          fi
          echo "OK: bundle sha matches trigger"

  # -------------------------------------------------------------------------
  # Final aggregation (Spec §57 §12). MUST depend on every required job.
  # Does NOT use `if: always()` to declare success when dependencies
  # failed; only ever publishes when `overall == pass`.
  # -------------------------------------------------------------------------
  final-aggregate:
    runs-on: ubuntu-latest
    needs:
      - run-orchestrator
      - verify-exact-sha
      - formatting-clippy
      - point-directory-structure
      - hlc-multirun
      - result-cache-race
      - controlled-scan-structure
      - hnsw-connectivity
      - eight-seed-churn-smoke
      - hot-observability
      - full-core-tests
      - full-workspace-tests
      - orchestrator-self-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download closure evidence
        uses: actions/download-artifact@v4
        with:
          name: residual-closure-evidence
          path: ${{ runner.temp }}/mongreldb-residual-closure/
      - name: Parse closure-status.json and require overall == pass
        env:
          EXPECTED_SHA: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/mongreldb-residual-closure"
          [[ -s "$bundle/closure-status.json" ]] || { echo "FAIL: closure-status.json missing" >&2; exit 1; }

          overall="$(jq -r '.overall // "fail"' "$bundle/closure-status.json")"
          [[ "$overall" == "pass" ]] || {
            echo "FAIL: closure-status.json overall=$overall (expected pass)" >&2
            jq -S '.suites[] | select(.exit_code != 0 or .required_tests == "fail" or .thresholds == "fail") | {name, exit_code, required_tests, thresholds}' \
              "$bundle/closure-status.json" >&2 || true
            exit 1
          }

          # Cross-check the bundle SHA against the workflow trigger ref.
          bundle_sha="$(cat "$bundle/commit.txt" | tr -d '[:space:]')"
          expected="$(echo "$EXPECTED_SHA" | tr -d '[:space:]')"
          [[ ${#expected} -lt 40 ]] && expected="$(git rev-parse "$expected")"
          [[ "$bundle_sha" == "$expected" ]] || {
            echo "FAIL: bundle sha ($bundle_sha) != trigger sha ($expected)" >&2
            exit 1
          }

          # Cross-check that every shard has a matching SHA sidecar.
          while IFS= read -r sidecar; do
            [[ -z "$sidecar" ]] && continue
            sha="$(cat "$sidecar")"
            [[ "$sha" == "$expected" ]] || {
              echo "FAIL: sidecar $sidecar sha=$sha != expected=$expected" >&2
              exit 1
            }
          done < <(find "$bundle" -name '*.sha' -print)

          # Cross-check that every suite recorded exit_code == 0 and
          # declared thresholds/required-tests are pass.
          bad="$(jq -r '
              [.suites[]
                | select(
                    .exit_code != 0
                    or .required_tests == "fail"
                    or .thresholds == "fail"
                  )
              ] | length' "$bundle/closure-status.json")"
          [[ "$bad" == "0" ]] || {
            echo "FAIL: $bad suite(s) reported a non-pass state" >&2
            exit 1
          }

          echo "OK: closure-status.json reports overall=pass; bundle sha matches; all shards stamped."
