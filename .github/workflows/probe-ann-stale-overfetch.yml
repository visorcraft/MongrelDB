name: Validate ANN stale-overfetch fix

on:
  push:
    branches: [agent/probe-ann-stale-overfetch-ca3]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Apply minimal production fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/mongreldb-core/src/index/ann/mod.rs')
          source = path.read_text()
          old = '            for (row_id, distance) in graph.search(query, k, self.ef_search, context)? {\n'
          new = '            for (row_id, distance) in graph.search(query, k, self.ef_search.max(k), context)? {\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected one ANN search target, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          cargo fmt
          git diff --check
      - name: Formatting and Clippy
        run: |
          cargo fmt --check
          cargo clippy -p mongreldb-core --all-targets --all-features -- -D warnings
      - name: Focused ANN regression tests
        run: |
          cargo test -p mongreldb-core --all-features \
            --test ann_stale_overfetch -- --nocapture
          cargo test -p mongreldb-core --all-features \
            --test retriever -- --nocapture
          cargo test -p mongreldb-core --all-features \
            --test ai_query_limits -- --nocapture
      - name: Complete core suite
        run: cargo test -p mongreldb-core --all-features
