name: Probe ANN stale overfetch

on:
  push:
    branches: [agent/probe-ann-stale-overfetch-ca3]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format and compile probe
        run: |
          cargo fmt
          cargo clippy -p mongreldb-core --test ann_stale_overfetch --all-features -- -D warnings
      - name: Run stale-overfetch regression probe
        id: probe
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/ann-stale-overfetch
          cargo test -p mongreldb-core --all-features \
            --test ann_stale_overfetch -- --nocapture \
            2>&1 | tee /tmp/ann-stale-overfetch/test.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ann-stale-overfetch
          path: /tmp/ann-stale-overfetch
          if-no-files-found: error
      - name: Preserve failing probe result
        if: always()
        run: test "${{ steps.probe.outputs.status }}" = 0
