[package]
name = "mongreldb-query"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DataFusion SQL + Arrow frontend for MongrelDB."

[dependencies]
mongreldb-core = { path = "../mongreldb-core", version = "0.67.1" }
mongreldb-types = { path = "../mongreldb-types", version = "0.67.1" }
datafusion = { version = "56.0.0", default-features = false, features = ["nested_expressions", "crypto_expressions", "datetime_expressions", "encoding_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "compression", "recursive_protection", "sql"] }
# sqlparser 0.64 is newer, but datafusion 56.0 requires sqlparser ^0.63.
# A second copy would not unify with DataFusion's SQL dialect.
arrow = "60"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.63.0"
parking_lot = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
regex = "1"
getrandom = "0.4"
sha2 = "0.11"
aes-gcm = "0.11"
bincode = "1"
tempfile = "3"

[dev-dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
criterion = { version = "0.8", features = ["async_tokio"] }
mongreldb-core = { path = "../mongreldb-core", version = "0.67.1" }

[[bench]]
name = "sql_cancellation"
harness = false
